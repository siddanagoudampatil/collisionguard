[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "collisionguard"
version = "0.1.0"
description = "Pre-execution merge conflict forecasting for concurrent coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Siddanagouda Patil"},
    {name = "Kanishq Upadhyay"},
    {name = "Mitansh Maheshwari"}
]
dependencies = [
    "duckdb>=1.0.0",
    "lightgbm>=4.0.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "mlxtend>=0.23.0",
    "simpy>=4.1.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
